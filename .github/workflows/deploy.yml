name: Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'ai-reviewer/**'
      - 'stock-portfolio.html'
      - 'bluetooth_robot_car/website/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/bluetooth_robot_car
          cp index.html stock-portfolio.html _site/
          cp -r ai-reviewer _site/
          cp -r bluetooth_robot_car/website _site/bluetooth_robot_car/website
          if [ -d assets ]; then cp -r assets _site/; fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
