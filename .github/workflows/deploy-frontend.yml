name: Deploy AI Reviewer Frontend

on:
  push:
    branches: [main]
    paths:
      - 'AI-solver-reviewer/frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: AI-solver-reviewer/frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./AI-solver-reviewer/frontend
      run: npm ci
    
    - name: Build
      working-directory: ./AI-solver-reviewer/frontend
      env:
        REACT_APP_API_URL: http://13.211.53.117:8000
      run: npm run build
    
    - name: Copy root index.html
      run: |
        mkdir -p _site
        cp index.html _site/
        cp stock-portfolio.html _site/
        cp -r bluetooth_robot_car _site/
        cp -r AI-solver-reviewer/frontend/build _site/ai-reviewer
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './_site'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
