name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Prepare deployment
      run: |
        mkdir -p _site
        # Copy main portfolio files
        cp index.html _site/
        cp stock-portfolio.html _site/
        
        # Copy project directories
        cp -r bluetooth_robot_car _site/ 2>/dev/null || true
        cp -r stock_analysis_portfolio _site/ 2>/dev/null || true
        cp -r ai-reviewer _site/ 2>/dev/null || true
        
        # Copy any other HTML files
        find . -maxdepth 1 -name "*.html" -not -name "index.html" -not -name "stock-portfolio.html" -exec cp {} _site/ \; 2>/dev/null || true
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './_site'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
