<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Reviewer - Working App</title>
    <link rel="stylesheet" href="app-style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>AI Document Reviewer</h1>
                <p>Upload documents and chat with AI</p>
                <div class="session-info">
                    <span class="session-label">Session:</span>
                    <span id="session-id" class="session-value">Initializing...</span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="sidebar">
                <div class="upload-section">
                    <h2>Upload Documents</h2>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="file-input" accept=".pdf,.txt" multiple hidden>
                        <div class="upload-prompt">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>Click or drag files here</p>
                            <span class="file-types">PDF or TXT files</span>
                        </div>
                    </div>
                    <button id="upload-btn" class="btn-primary" style="display: none;">Upload Files</button>
                </div>

                <div class="documents-section">
                    <h3>Uploaded Documents</h3>
                    <div id="document-list" class="document-list">
                        <p class="empty-state">No documents uploaded yet</p>
                    </div>
                </div>
            </div>

            <div class="chat-section">
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <div class="welcome-message">
                            <h3>Welcome to AI Document Reviewer</h3>
                            <p>Upload a document to get started, then ask me anything about it!</p>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <textarea id="chat-input" class="chat-input" placeholder="Ask a question about your documents..."
                        rows="1"></textarea>
                    <button id="send-btn" class="btn-send">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app-script.js"></script>
</body>

</html>
