<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Reviewer</title>
    <link rel="stylesheet" href="app-style.css">
</head>
<body>
    <div class="app-container">
        <!-- Floating notification area for session -->
        <div class="session-info">
            <span class="session-label">Session:</span>
            <span id="session-id" class="session-value">Initializing...</span>
        </div>

        <main class="chat-main">
            <div id="chat-messages" class="chat-messages">
                <!-- Empty state hero -->
                <div class="welcome-hero" id="welcome-hero">
                    <div class="hero-logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
                    </div>
                    <h1>How can I help you?</h1>
                    <p>Upload a document and ask questions.</p>
                </div>
            </div>

            <!-- Unified Floating Input Box -->
            <div class="chat-input-wrapper">
                
                <!-- Pills area for displaying uploaded files -->
                <div id="file-pills-container" class="file-pills-container"></div>
                
                <div class="chat-input-box">
                    <input type="file" id="file-input" accept=".pdf,.txt" multiple hidden>
                    
                    <button class="icon-btn" id="attach-btn" title="Attach Document" aria-label="Upload Document">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>

                    <textarea id="chat-input" class="chat-input" placeholder="Message AI Reviewer..." rows="1"></textarea>
                    
                    <button id="send-btn" class="send-btn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
                <div class="input-disclaimer">AI Document Reviewer can make mistakes. Consider verifying important information.</div>
            </div>
        </main>
    </div>

    <!-- Adding marked CDN back since it was overwritten by full index.html rewrite -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app-script.js"></script>
</body>
</html>
