<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Reviewer - Working App</title>
    <link rel="stylesheet" href="app-style.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>AI Document Reviewer</h1>
                <p>Upload documents and chat with AI</p>
                <div class="session-info">
                    <span class="session-label">Session:</span>
                    <span id="session-id" class="session-value">Initializing...</span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <!-- Mobile Navigation -->
            <div class="mobile-tabs">
                <button class="tab-btn active" data-tab="upload">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Documents
                </button>
                <button class="tab-btn" data-tab="chat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Chat
                </button>
            </div>

            <div class="sidebar active" id="sidebar-view">
                <div class="upload-section">
                    <h2>Upload Documents</h2>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="file-input" accept=".pdf,.txt" multiple hidden>
                        <div class="upload-prompt">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>Click or drag files here</p>
                            <span class="file-types">PDF or TXT files</span>
                        </div>
                    </div>
                    <button id="upload-btn" class="btn-primary" style="display: none;">Upload Files</button>
                </div>

                <div class="documents-section">
                    <h3>Uploaded Documents</h3>
                    <div id="document-list" class="document-list">
                        <p class="empty-state">No documents uploaded yet</p>
                    </div>
                </div>
            </div>

            <div class="chat-section" id="chat-view">
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <div class="welcome-message">
                            <div class="bot-avatar-large">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
                            </div>
                            <h3>AI Document Reviewer</h3>
                            <p>I'm ready to help! Upload a document and ask me questions.</p>
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <textarea id="chat-input" class="chat-input" placeholder="Type your message..." rows="1"></textarea>
                    <button id="send-btn" class="btn-send">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app-script.js"></script>
</body>

</html>
