version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-reviewer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=https://${GITHUB_USERNAME}/cs_stuff.github.io/AI-solver-reviewer
      - ENVIRONMENT=production
    depends_on:
      - postgres
    networks:
      - ai-reviewer-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:15-alpine
    container_name: ai-reviewer-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ai_reviewer_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-reviewer-network
    ports:
      - "5432:5432"

networks:
  ai-reviewer-network:
    driver: bridge

volumes:
  postgres_data:
