name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      run: |
        echo "Backend deployment to Render"
        echo "Note: Configure Render to auto-deploy from GitHub repository"
        echo "Or use Render CLI to trigger deployment"
        # Render typically auto-deploys on git push if configured
        # For manual deployment via API, you would use:
        # curl -X POST https://api.render.com/v1/services/{service_id}/deploys \
        #   -H "Authorization: Bearer $RENDER_API_KEY"


